baseURL = 'https://0u-Y.github.io/'
languageCode = 'en-us'
title = "0u-Y's Log"
theme = "PaperMod"

[markup]
    [markup.highlight]
    noClasses = false
    style = "monokai"
    tabWidth = 4
    lineNos = true
    lineNumbersInTable = true

[params]
    math = true
    defaultTheme = "auto"
    ShowToc = true
    TocOpen = true
    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true

    [params.label]
        text = "Core Dump"
        icon = ""

    [params.profileMode]
        enabled = false

    [params.homeInfoParams]
        Title = "0u-Y's Log"
        Content = "Deep diving into Ethereum Core, L2 Scaling, and Protocol Security with Rust."


    [[params.socialIcons]]
        name = "Github"
        url = "https://github.com/0u-Y"

[menu]
    [[menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 10

    [[menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
    
    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 30